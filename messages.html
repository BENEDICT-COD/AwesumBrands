<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — AweSum Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1B33;
    --navy-panel:#0F2038;
    --navy-line: rgba(255,255,255,0.1);
    --orange:#F5820B;
    --orange-dark:#D96F00;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --muted-on-navy: rgba(255,255,255,0.6);
    --muted-on-white: rgba(10,10,10,0.5);
    --line-on-white: rgba(10,10,10,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--black);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  .app{
    display:grid;
    grid-template-columns:355px 1fr;
    height:100vh;
  }

  /* Back-to-site link (small, since this screen has no global header) */
  .back-link{
    position:absolute;
    top:16px;
    right:20px;
    z-index:20;
    font-size:13px;
    color:var(--muted-on-navy);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .back-link:hover{ color:var(--white); }
  .back-link svg{ width:14px; height:14px; }
  .site-nav{ position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:18px; padding:12px 20px; font-size:13px; color:var(--muted-on-navy); background:rgba(11,27,51,.96); }
  .site-nav .nav-links,.site-nav .nav-right{ display:flex; align-items:center; gap:14px; }
  .site-nav .nav-right .login-link{ color:var(--white); }
  .site-nav .btn{ border:1px solid var(--orange); color:var(--white); padding:8px 12px; border-radius:6px; background:transparent; }
  .site-nav .btn:hover{ background:var(--orange); }
  .site-nav a:hover{ color:var(--white); }
  @media(max-width:900px){ .site-nav{ gap:10px; padding:10px 8px; font-size:12px; } .site-nav .nav-links,.site-nav .nav-right{ gap:10px; } }

  /* Sidebar */
  .conv-sidebar{
    background:var(--navy);
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .conv-sidebar h1{
    color:var(--white);
    font-size:22px;
    font-weight:800;
    padding:26px 24px 18px;
  }
  .conv-item{
    display:flex;
    flex-direction:column;
    gap:4px;
    padding:16px 24px;
    border-top:1px solid var(--navy-line);
    cursor:pointer;
    transition:background .15s ease;
    position:relative;
  }
  .conv-item:hover{ background:rgba(255,255,255,0.04); }
  .conv-item.active{ background:var(--navy-panel); }
  .conv-item.active::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:3px;
    background:var(--orange);
  }
  .conv-top-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .conv-name{ color:var(--white); font-weight:700; font-size:15px; }
  .conv-time{ color:var(--muted-on-navy); font-size:12px; flex-shrink:0; }
  .conv-bottom-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .conv-preview{
    color:var(--muted-on-navy);
    font-size:13.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .conv-unread{
    background:var(--orange);
    color:var(--white);
    font-size:11px;
    font-weight:700;
    min-width:20px;
    height:20px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  /* Chat pane */
  .chat-pane{
    display:flex;
    flex-direction:column;
    height:100vh;
    background:var(--white);
  }
  .chat-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 32px;
    border-bottom:1px solid var(--line-on-white);
    flex-shrink:0;
  }
  .chat-avatar{
    width:42px; height:42px;
    border-radius:50%;
    background:var(--navy);
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:14px;
    flex-shrink:0;
  }
  .chat-header-info h2{ font-size:16.5px; font-weight:700; color:var(--black); }
  .chat-header-info p{ font-size:13px; color:var(--muted-on-white); }

  .chat-thread{
    flex:1;
    overflow-y:auto;
    padding:32px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .msg-row{ display:flex; }
  .msg-row.sent{ justify-content:flex-end; }
  .msg-row.received{ justify-content:flex-start; }
  .bubble{
    max-width:440px;
    padding:16px 20px;
    border-radius:16px;
    font-size:15px;
    line-height:1.5;
  }
  .msg-row.received .bubble{
    background:#F0F1F4;
    color:var(--black);
    border-bottom-left-radius:4px;
  }
  .msg-row.sent .bubble{
    background:var(--navy);
    color:var(--white);
    border-bottom-right-radius:4px;
  }
  .bubble .timestamp{
    display:block;
    font-size:11.5px;
    margin-top:8px;
    opacity:0.6;
  }

  .chat-input-bar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 32px;
    border-top:1px solid var(--line-on-white);
    flex-shrink:0;
  }
  .chat-input-bar input{
    flex:1;
    padding:14px 18px;
    border:1.5px solid var(--line-on-white);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    color:var(--black);
  }
  .chat-input-bar input::placeholder{ color:#9CA0AA; }
  .chat-input-bar input:focus{
    outline:none;
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(245,130,11,0.15);
  }
  .btn-send{
    background:var(--orange);
    color:var(--white);
    border:none;
    padding:14px 26px;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    transition:background .15s ease;
    flex-shrink:0;
  }
  .btn-send:hover{ background:var(--orange-dark); }

  .msg-row.sent .bubble{ position:relative; }
  .bubble-actions{ display:flex; align-items:center; gap:10px; margin-top:8px; }
  .bubble .timestamp{ display:inline-block; margin-top:0; }
  .msg-delete{
    background:none;
    border:none;
    padding:0;
    font-size:11.5px;
    font-family:inherit;
    color:rgba(255,255,255,0.55);
    text-decoration:underline;
    cursor:pointer;
    opacity:0;
    transition:opacity .15s ease, color .15s ease;
  }
  .msg-row.sent:hover .msg-delete{ opacity:1; }
  .msg-delete:hover{ color:#fff; }
  .empty-thread{
    margin:auto;
    text-align:center;
    color:var(--muted-on-white);
    font-size:14.5px;
    max-width:280px;
  }

  @media (max-width:860px){
    .app{ grid-template-columns:1fr; }
    .conv-sidebar{ display:none; }
    .conv-sidebar.show-mobile{ display:flex; position:fixed; inset:0; z-index:30; width:100%; }
    .chat-pane{ position:relative; }
  }
</style>
</head>
<body data-auth-required="user">

<nav class="site-nav">
  <div class="nav-links"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="quote.html">Custom Quote</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></div>
  <div class="nav-right"><a href="login.html" class="login-link">Login</a><a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a></div>
</nav>

<div class="app">
  <aside class="conv-sidebar">
    <h1>Messages</h1>

    <div class="conv-item active" id="convItem" data-initials="AS">
      <div class="conv-top-row">
        <span class="conv-name">AweSum Support</span>
        <span class="conv-time" id="convTime"></span>
      </div>
      <div class="conv-bottom-row">
        <span class="conv-preview" id="convPreview">Start a conversation with our team.</span>
      </div>
    </div>
  </aside>

  <div class="chat-pane">
    <div class="chat-header">
      <div class="chat-avatar" id="chatAvatar">AS</div>
      <div class="chat-header-info">
        <h2 id="chatName">AweSum Support</h2>
        <p>We typically reply within a few hours</p>
      </div>
    </div>

    <div class="chat-thread" id="chatThread">
      <div class="empty-thread" id="emptyThread">No messages yet. Send us a message and our team will get back to you here.</div>
    </div>

    <div class="chat-input-bar">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button class="btn-send" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const thread = document.getElementById('chatThread');
  const emptyThread = document.getElementById('emptyThread');
  const convPreview = document.getElementById('convPreview');
  const convTime = document.getElementById('convTime');
  const chatAvatar = document.getElementById('chatAvatar');
  const user = AweSum.currentUser();

  const formatTime = value => new Date(value).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function initialsOf(name){
    return String(name || 'AS').trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || 'AS';
  }
  if (user) chatAvatar.textContent = initialsOf(user.name);

  function updateSidebarPreview(messages){
    if (!messages.length) { convPreview.textContent = 'Start a conversation with our team.'; convTime.textContent = ''; return; }
    const last = messages[messages.length - 1];
    convPreview.textContent = (last.reply || last.text || '').slice(0, 60);
    convTime.textContent = formatTime(last.repliedAt || last.createdAt);
  }

  function appendRow(className, text, time, messageId){
    const row = document.createElement('div');
    row.className = 'msg-row ' + className;
    row.dataset.id = messageId || '';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    const actions = document.createElement('div');
    actions.className = 'bubble-actions';
    const timestamp = document.createElement('span');
    timestamp.className = 'timestamp';
    timestamp.textContent = time;
    actions.appendChild(timestamp);
    if (className === 'sent' && messageId) {
      const del = document.createElement('button');
      del.className = 'msg-delete';
      del.type = 'button';
      del.textContent = 'Delete';
      del.addEventListener('click', () => deleteMessage(messageId, row));
      actions.appendChild(del);
    }
    bubble.appendChild(actions);
    row.appendChild(bubble);
    thread.appendChild(row);
    return row;
  }

  function renderThread(messages){
    thread.querySelectorAll('.msg-row').forEach(row => row.remove());
    if (!messages.length) { emptyThread.style.display = ''; }
    else {
      emptyThread.style.display = 'none';
      messages.slice().sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)).forEach(message => {
        appendRow(message.senderRole === 'admin' ? 'received' : 'sent', message.text, formatTime(message.createdAt), message.senderRole === 'admin' ? '' : message.id);
        if (message.reply) appendRow('received', message.reply, formatTime(message.repliedAt || message.createdAt));
      });
    }
    updateSidebarPreview(messages);
    thread.scrollTop = thread.scrollHeight;
  }

  function loadThread(){
    AweSum.api('messages').then(result => renderThread(result.messages || [])).catch(error => AweSum.showMessage(error.message, 'error'));
  }
  if (user) loadThread();

  function deleteMessage(messageId, row){
    if (!confirm('Delete this message?')) return;
    AweSum.api('message', { method: 'DELETE', body: JSON.stringify({ id: messageId }) })
      .then(() => { row.remove(); const next = row.nextElementSibling; if (next && next.classList.contains('received') && !next.dataset.id) next.remove(); if (!thread.querySelector('.msg-row')) emptyThread.style.display = ''; })
      .catch(error => AweSum.showMessage(error.message, 'error'));
  }

  function sendMessage(){
    const text = input.value.trim();
    if(!text) return;
    if (!user) { window.location.href = 'login.html'; return; }
    sendBtn.disabled = true;
    AweSum.api('message', { method: 'POST', body: JSON.stringify({ name: user.name, email: user.email, text }) })
      .then(result => {
        emptyThread.style.display = 'none';
        appendRow('sent', text, formatTime(new Date()), result.reference);
        thread.scrollTop = thread.scrollHeight;
        convPreview.textContent = text.slice(0, 60);
        convTime.textContent = formatTime(new Date());
        input.value = '';
      })
      .catch(error => AweSum.showMessage(error.message, 'error'))
      .finally(() => { sendBtn.disabled = false; });
  }
  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
