<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Back — AweSum Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Georgia&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1B33;
    --logo-navy:#28308C;
    --orange:#F5820B;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --muted:#6b7280;
    --border:#E3E5EA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--navy);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
  }
  a{ text-decoration:none; }

  .auth-card{
    background:var(--white);
    width:100%;
    max-width:460px;
    border-radius:22px;
    padding:44px 44px 40px;
    box-shadow:0 30px 70px rgba(0,0,0,0.45);
  }

  .back-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    background:transparent;
    color:var(--navy);
    font:inherit;
    font-weight:700;
    cursor:pointer;
    margin-bottom:18px;
    padding:0;
  }

  .back-button:hover{ color:var(--orange); }

  .logo-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:22px;
  }
  .logo-mark{ display:block; margin-bottom:2px; }
  .logo-word{
    font-family:'Trebuchet MS', 'Inter', sans-serif;
    font-size:19px;
    color:#3a3a3a;
    letter-spacing:0.2px;
    border-bottom:1.5px solid var(--orange);
    padding-bottom:3px;
    margin-top:-6px;
  }
  .logo-word span:first-child{ font-weight:400; }
  .logo-tagline{
    font-size:9px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#9a9a9a;
    margin-top:5px;
  }

  h1.title{
    text-align:center;
    font-size:27px;
    font-weight:800;
    color:var(--navy);
    letter-spacing:-0.5px;
    margin-bottom:6px;
  }
  p.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    margin-bottom:30px;
  }

  .field{ margin-bottom:20px; }
  .field label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    color:var(--black);
    background:var(--white);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color:#9CA0AA; }
  .field input:focus{
    outline:none;
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(245,130,11,0.15);
  }

  .btn-submit{
    width:100%;
    padding:15px;
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease, transform .15s ease;
  }
  .btn-submit:hover{ background:#D96F00; }
  .btn-submit:active{ transform:translateY(1px); }

  .switch-line{
    text-align:center;
    margin-top:26px;
    font-size:14.5px;
    color:var(--muted);
  }
  .switch-line a{
    color:var(--navy);
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:2px;
    transition:color .15s ease;
  }
  .switch-line a:hover{ color:var(--orange); }

  @media (max-width:520px){
    .auth-card{ padding:36px 26px 32px; border-radius:18px; }
  }
</style>
</head>
<body>

  <div class="auth-card">
    <button type="button" class="back-button" onclick="history.back()" aria-label="Go back">← Back</button>
    <div class="logo-block">
      <svg class="logo-mark" width="92" height="72" viewBox="0 0 92 72" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bTopLI"><rect x="0" y="0" width="92" height="30"/></clipPath>
          <clipPath id="bBotLI"><rect x="0" y="30" width="92" height="42"/></clipPath>
        </defs>
        <text x="0" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#28308C">A</text>
        <g clip-path="url(#bTopLI)">
          <text x="34" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#F5820B">B</text>
        </g>
        <g clip-path="url(#bBotLI)">
          <text x="34" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#28308C">B</text>
        </g>
      </svg>
      <div class="logo-word"><span>Awe</span><span style="font-weight:700;">Sum</span> Brands</div>
      <div class="logo-tagline">Redefining Brands &amp; Marketing</div>
    </div>

    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Sign in to your account</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.co.za" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>

  </div>

<script src="app.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    try { const result = await AweSum.api('login', { method: 'POST', body: JSON.stringify({ email, password }) }); AweSum.write(AweSum.keys.session, result.user); window.location.href = result.user.role === 'admin' ? 'admin.html' : 'index.html'; }
    catch (error) { AweSum.showMessage(error.message, 'error'); }
  });
</script>
</body>
</html>
