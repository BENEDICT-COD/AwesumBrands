<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AweSum Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1B33;--orange:#F5820B;--orange-dark:#D96F00;--black:#0A0A0A;--white:#fff;--muted:#667085;--line:#e3e5ea}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter, sans-serif;color:var(--black);background:#fff}a{text-decoration:none;color:inherit}.wrap{max-width:1200px;margin:auto;padding:0 24px}header{background:var(--navy);padding:16px 0;color:#fff}.site-header{display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:800;font-size:18px}.brand span{color:var(--orange)}.main-nav,.nav-right{display:flex;align-items:center;gap:18px}.main-nav{font-size:14px}.nav-right{font-size:14px}.main-nav a:hover,.login-link:hover{color:var(--orange)}.btn{border:0;cursor:pointer;font:inherit}.btn-primary{background:var(--orange);color:var(--white);padding:9px 14px;border-radius:7px}.btn-primary:hover{background:var(--orange-dark)}main{padding:54px 0 90px}h1{font-size:34px;color:var(--navy);margin-bottom:8px}.intro{color:var(--muted);margin-bottom:34px}.checkout-grid{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}.panel{border:1px solid var(--line);border-radius:16px;padding:26px}.panel h2{font-size:19px;color:var(--navy);margin-bottom:22px}.field{margin-bottom:18px}.field label{display:block;font-weight:600;font-size:14px;color:var(--navy);margin-bottom:7px}.field input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:9px;font:inherit}.field input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px #f5820b26}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.summary-line{display:flex;justify-content:space-between;padding:10px 0;color:var(--muted);font-size:14px}.summary-line.total{border-top:1px solid var(--line);margin-top:10px;padding-top:18px;color:var(--navy);font-weight:800;font-size:18px}.summary-line.total strong{color:var(--orange);font-size:22px}.pay-btn{border:0;border-radius:10px;background:var(--orange);color:#fff;font:700 15px Inter;width:100%;padding:15px;margin-top:20px;cursor:pointer}.pay-btn:hover{background:var(--orange-dark)}.gateway-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px}@media(max-width:850px){.main-nav{display:none}.checkout-grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head>
<body><header><div class="wrap site-header"><a class="brand" href="index.html"><img src="images/logo.jpg" alt="AweSum Brands logo" style="height:42px; width:auto; display:block;"></a><nav class="main-nav"><a href="marketplace.html">Marketplace</a><a href="quote.html">Custom Quote</a><a href="messages.html">Messages</a><a href="orders.html">Orders</a><a href="cart.html">Cart</a></nav><div class="nav-right"><a href="login.html" class="login-link">Login</a><a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a></div></div></header>
<main><div class="wrap"><h1>Secure Checkout</h1><p class="intro">Complete your details and payment to place your order.</p><div class="checkout-grid"><form class="panel" id="checkoutForm"><h2>Delivery and payment</h2><div class="field"><label for="address">Delivery address</label><input id="address" required placeholder="Street address, city, postal code"></div><button class="pay-btn" type="submit">Continue to secure payment</button><p class="gateway-note">You will complete payment on our secure payment provider's hosted checkout. Card details are never handled by this website.</p></form><aside class="panel"><h2>Order summary</h2><div id="summary"></div></aside></div></div></main>
<script src="app.js"></script><script>
const user = AweSum.currentUser(); const cart = AweSum.getCart(); const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0); const vat = subtotal * .15; const total = subtotal + vat;
document.getElementById('summary').innerHTML = '<div class="summary-line"><span>Items</span><span>' + cart.reduce((sum, item) => sum + item.quantity, 0) + '</span></div><div class="summary-line"><span>Subtotal</span><span>' + AweSum.money(subtotal) + '</span></div><div class="summary-line"><span>VAT (15%)</span><span>' + AweSum.money(vat) + '</span></div><div class="summary-line total"><span>Total</span><strong>' + AweSum.money(total) + '</strong></div>';
document.getElementById('checkoutForm').addEventListener('submit', async event => { event.preventDefault(); if (!user) { location.href = 'login.html'; return; } if (!cart.length) { AweSum.showMessage('Your cart is empty.', 'error'); return; } if (!AweSum.paymentGatewayUrl) { AweSum.showMessage('Payment gateway is not configured yet. Add your hosted checkout URL in app.js.', 'error'); return; } const order = { items: cart, total, address: document.getElementById('address').value.trim() }; try { const result = await AweSum.api('order', { method: 'POST', body: JSON.stringify(order) }); const separator = AweSum.paymentGatewayUrl.includes('?') ? '&' : '?'; window.location.href = AweSum.paymentGatewayUrl + separator + 'reference=' + encodeURIComponent(result.reference) + '&amount=' + encodeURIComponent(total.toFixed(2)) + '&email=' + encodeURIComponent(user.email); } catch (error) { AweSum.showMessage(error.message, 'error'); } });
</script></body></html>
