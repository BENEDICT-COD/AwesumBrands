<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — AweSum Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1B33;
    --logo-navy:#28308C;
    --orange:#F5820B;
    --black:#0A0A0A;
    --white:#FFFFFF;
    --muted:#6b7280;
    --border:#E3E5EA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--navy);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
  }
  a{ text-decoration:none; }

  .auth-card{
    background:var(--white);
    width:100%;
    max-width:460px;
    border-radius:22px;
    padding:44px 44px 40px;
    box-shadow:0 30px 70px rgba(0,0,0,0.45);
  }

  .back-button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    background:transparent;
    color:var(--navy);
    font:inherit;
    font-weight:700;
    cursor:pointer;
    margin-bottom:18px;
    padding:0;
  }

  .back-button:hover{ color:var(--orange); }

  .logo-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:22px;
  }
  .logo-mark{ display:block; margin-bottom:2px; }
  .logo-word{
    font-family:'Trebuchet MS', 'Inter', sans-serif;
    font-size:19px;
    color:#3a3a3a;
    letter-spacing:0.2px;
    border-bottom:1.5px solid var(--orange);
    padding-bottom:3px;
    margin-top:-6px;
  }
  .logo-word span:first-child{ font-weight:400; }
  .logo-tagline{
    font-size:9px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#9a9a9a;
    margin-top:5px;
  }

  h1.title{
    text-align:center;
    font-size:27px;
    font-weight:800;
    color:var(--navy);
    letter-spacing:-0.5px;
    margin-bottom:6px;
  }
  p.subtitle{
    text-align:center;
    color:var(--muted);
    font-size:15px;
    margin-bottom:30px;
  }

  .field{ margin-bottom:20px; }
  .field label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:8px;
  }
  .field input{
    width:100%;
    padding:13px 16px;
    border:1.5px solid var(--border);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    color:var(--black);
    background:var(--white);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color:#9CA0AA; }
  .field input:focus{
    outline:none;
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(245,130,11,0.15);
  }
  .field-optional-label{
    font-weight:400;
    color:var(--muted);
  }

  .btn-submit{
    width:100%;
    padding:15px;
    background:var(--orange);
    color:var(--white);
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease, transform .15s ease;
  }
  .btn-submit:hover{ background:#D96F00; }
  .btn-submit:active{ transform:translateY(1px); }

  .switch-line{
    text-align:center;
    margin-top:26px;
    font-size:14.5px;
    color:var(--muted);
  }
  .switch-line a{
    color:var(--navy);
    font-weight:700;
    text-decoration:underline;
    text-underline-offset:2px;
    transition:color .15s ease;
  }
  .switch-line a:hover{ color:var(--orange); }

  @media (max-width:520px){
    .auth-card{ padding:36px 26px 32px; border-radius:18px; }
  }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:48px; }
  .pw-toggle{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:none; border:0; border-radius:8px; cursor:pointer; color:#667085; }
  .pw-toggle:hover{ color:#F5820B; }
  .pw-toggle:focus-visible{ outline:2px solid #F5820B; outline-offset:1px; }
  .pw-toggle svg{ width:20px; height:20px; }
  .pw-toggle .eye-off{ display:none; }
  .pw-toggle.showing .eye{ display:none; }
  .pw-toggle.showing .eye-off{ display:block; }
  .pw-hint{ font-size:12.5px; margin-top:7px; color:#667085; min-height:16px; }
  .pw-hint.bad{ color:#b42318; }
  .pw-hint.good{ color:#067647; }
  .forgot-line{ text-align:right; margin:-8px 0 16px; font-size:13.5px; }
  .forgot-line a{ color:var(--navy); font-weight:600; text-decoration:underline; text-underline-offset:2px; }
  .forgot-line a:hover{ color:var(--orange); }
  .or-divider{ display:flex; align-items:center; gap:14px; margin:22px 0 16px; color:var(--muted); font-size:13px; }
  .or-divider::before,.or-divider::after{ content:''; flex:1; height:1px; background:var(--border); }
  .google-btn-wrap{ display:flex; justify-content:center; min-height:44px; }
  .consent{ text-align:center; font-size:12.5px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .consent a{ color:var(--navy); font-weight:600; }
  /* ===== Responsive tap target (added) ===== */
  .back-button{ padding:12px 14px 12px 0; margin:-12px 0 6px; }
  /* ===== end responsive tap target ===== */
</style>
</head>
<body>

  <div class="auth-card">
    <button type="button" class="back-button" onclick="history.back()" aria-label="Go back">← Back</button>
    <div class="logo-block">
      <svg class="logo-mark" width="92" height="72" viewBox="0 0 92 72" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="bTopSU"><rect x="0" y="0" width="92" height="30"/></clipPath>
          <clipPath id="bBotSU"><rect x="0" y="30" width="92" height="42"/></clipPath>
        </defs>
        <text x="0" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="var(--logo-navy, #28308C)">A</text>
        <g clip-path="url(#bTopSU)">
          <text x="34" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#F5820B">B</text>
        </g>
        <g clip-path="url(#bBotSU)">
          <text x="34" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#28308C">B</text>
        </g>
      </svg>
      <div class="logo-word"><span>Awe</span><span style="font-weight:700;">Sum</span> Brands</div>
      <div class="logo-tagline">Redefining Brands &amp; Marketing</div>
    </div>

    <h1 class="title">Create account</h1>
    <p class="subtitle">Start your printing journey</p>

    <form id="signupForm">
      <div class="field">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Sipho Dlamini" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.co.za" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" data-target="password" aria-label="Show password" aria-pressed="false"><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="pw-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="8" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show password" aria-pressed="false"><svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.7 19.7 0 0 1-3.17 4.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
        </div>
        <p class="pw-hint" id="pwHint" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="company">Company <span class="field-optional-label">(optional)</span></label>
        <input type="text" id="company" name="company" placeholder="Your Business Name">
      </div>
      <button type="submit" class="btn-submit">Create Account</button>
      <p class="consent">By creating an account you agree to our <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
    </form>

    <div id="googleSection" style="display:none;">
      <div class="or-divider"><span>or</span></div>
      <div id="googleButton" class="google-btn-wrap"></div>
    </div>

    <p class="switch-line">Already have an account? <a href="login.html">Sign in</a></p>

  </div>

<script src="app.js"></script>
<script>
  document.getElementById('signupForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (password.length < 8) { AweSum.showMessage('Password must be at least 8 characters.', 'error'); return; }
    if (password !== confirmPassword) { AweSum.showMessage('Passwords do not match.', 'error'); document.getElementById('confirmPassword').focus(); return; }
    try { await AweSum.api('signup', { method: 'POST', body: JSON.stringify({ name, email, password, company: document.getElementById('company').value.trim() }) }); AweSum.showMessage('Account created. Please sign in.'); window.location.href = 'login.html'; }
    catch (error) { AweSum.showMessage(error.message.includes('Duplicate') ? 'An account with this email already exists.' : error.message, 'error'); }
  });
</script>
<script>
  (function () {
    const pw = document.getElementById('password'), confirmPw = document.getElementById('confirmPassword'), hint = document.getElementById('pwHint');
    document.querySelectorAll('.pw-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const input = document.getElementById(btn.dataset.target);
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.classList.toggle('showing', show);
        btn.setAttribute('aria-pressed', String(show));
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });
    function check() {
      if (!confirmPw.value) { hint.textContent = ''; hint.className = 'pw-hint'; return; }
      const ok = pw.value === confirmPw.value;
      hint.textContent = ok ? 'Passwords match' : 'Passwords do not match';
      hint.className = 'pw-hint ' + (ok ? 'good' : 'bad');
    }
    pw.addEventListener('input', check);
    confirmPw.addEventListener('input', check);
  })();
</script>
<script>
  (function () {
    AweSum.api('auth-config').then(function (config) {
      if (!config.googleClientId) return;
      var script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.onload = function () {
        google.accounts.id.initialize({
          client_id: config.googleClientId,
          callback: async function (response) {
            try {
              const result = await AweSum.api('google-login', { method: 'POST', body: JSON.stringify({ credential: response.credential }) });
              if (!result.user) throw new Error('Google sign-in did not complete. Please try again.');
              AweSum.write(AweSum.keys.session, result.user);
              window.location.href = result.user.role === 'admin' ? 'admin.html' : 'index.html';
            } catch (error) { AweSum.showMessage(error.message, 'error'); }
          }
        });
        google.accounts.id.renderButton(document.getElementById('googleButton'), { theme: 'outline', size: 'large', width: 320, text: 'signup_with', shape: 'rectangular' });
        document.getElementById('googleSection').style.display = '';
      };
      document.head.appendChild(script);
    }).catch(function () {});
  })();
</script>
</body>
</html>
