<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1B33">
<title>Admin · AweSum Brands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1B33; --navy-2:#122747; --navy-3:#1D3763;
  --orange:#F5820B; --orange-600:#D96F00; --orange-50:#FFF3E5; --orange-100:#FFE2BF;
  --bg:#F3F5F9; --card:#FFFFFF; --text:#101828; --muted:#667085; --faint:#98A2B3;
  --line:#E6E9F0; --line-2:#EFF1F6;
  --green:#12B76A; --green-50:#E7F8EF; --green-700:#067647;
  --blue-50:#EAF1FF; --blue-700:#1D4FBF;
  --amber-50:#FFF4DB; --amber-700:#A15C07;
  --red:#F04438; --red-50:#FEECEB; --red-700:#B42318;
  --violet-50:#F0ECFF; --violet-700:#5B3CC4;
  --slate-50:#F2F4F7; --slate-700:#475467;
  --r:14px; --r-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 8px 28px rgba(16,24,40,.08);
  --shadow-lg:0 30px 70px rgba(11,27,51,.30);
  --sidebar:268px; --topbar:72px;
  --pad:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.compact{--pad:20px;font-size:14px}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid rgba(245,130,11,.45);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .nowrap{white-space:nowrap}

/* ---------- boot screen ---------- */
.boot{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--muted);font-weight:600}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--navy) 0%,#0a1730 100%);color:#fff;display:flex;flex-direction:column;z-index:60}
.side-brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
.logo-chip{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;padding:4px;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.logo-chip img{width:100%;height:100%;object-fit:contain}
.side-brand strong{display:block;font-size:16px;letter-spacing:-.2px}
.side-brand small{display:block;color:#8FA0BF;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-top:1px}
.side-nav{flex:1;overflow-y:auto;padding:6px 12px 12px;scrollbar-width:thin;scrollbar-color:#27406b transparent}
.nav-group{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6E81A6;font-weight:700;padding:16px 12px 6px}
.nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#B5C2DA;font-weight:600;font-size:14px;position:relative;transition:background .15s,color .15s}
.nav-link svg{width:19px;height:19px;flex:none;opacity:.9}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link.active{background:rgba(245,130,11,.16);color:#fff}
.nav-link.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--orange)}
.nav-link.active svg{color:var(--orange);opacity:1}
.nav-badge{margin-left:auto;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;min-width:22px;height:22px;padding:0 7px;border-radius:999px;display:grid;place-items:center}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.me{display:flex;align-items:center;gap:11px;padding:6px 6px 12px}
.me b{display:block;font-size:13.5px;line-height:1.25}
.me small{display:block;color:#8FA0BF;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:168px}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side-actions .btn{justify-content:center;padding:9px 10px;font-size:13px}
.btn-side{background:rgba(255,255,255,.08);color:#E3EAF7}
.btn-side:hover{background:rgba(255,255,255,.14)}
.scrim{position:fixed;inset:0;background:rgba(7,14,28,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar);display:flex;align-items:center;gap:16px;padding:0 var(--pad);background:rgba(243,245,249,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.tb-title{min-width:0;flex:1}
.tb-title h1{font-size:21px;letter-spacing:-.4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;gap:8px;align-items:center}
.icon-btn.menu-btn{display:none}
.view{padding:var(--pad);max-width:1380px;width:100%;margin:0 auto;outline:none}
.view>*+*{margin-top:22px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .05s,border-color .15s;border:1.5px solid transparent}
.btn svg{width:17px;height:17px;flex:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(245,130,11,.28)}
.btn-primary:hover:not([disabled]){background:var(--orange-600)}
.btn-dark{background:var(--navy);color:#fff}.btn-dark:hover:not([disabled]){background:var(--navy-2)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text);box-shadow:var(--shadow-sm)}
.btn-ghost:hover:not([disabled]){border-color:#cfd5e2;background:#fafbfd}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover:not([disabled]){background:#d92d20}
.btn-soft-danger{background:var(--red-50);color:var(--red-700)}.btn-soft-danger:hover:not([disabled]){background:#fddcda}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.btn.busy{position:relative;color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.btn-ghost.busy::after{border-color:#d0d5dd;border-top-color:var(--orange)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{border-color:#cfd5e2}
.link-btn{color:var(--orange-600);font-weight:600}.link-btn:hover{text-decoration:underline}

input[type=text],input[type=email],input[type=url],input[type=number],input[type=search],input[type=password],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:96px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(245,130,11,.14)}
input:disabled,select:disabled,textarea:disabled{background:var(--slate-50);color:var(--muted);cursor:not-allowed}
label.lbl,.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.field{margin-bottom:16px}
.field .help{font-size:12.5px;color:var(--muted);margin-top:6px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.input-affix{position:relative}
.input-affix>span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600;pointer-events:none}
.input-affix input{padding-left:32px}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.search input{padding-left:40px;background:#fff}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line-2)}
.card-head h2{font-size:16px;letter-spacing:-.2px}
.card-head p{color:var(--muted);font-size:13px}
.card-head .grow{flex:1;min-width:0}
.card-body{padding:22px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px}
.pill{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 8px;border-radius:999px;background:var(--orange-50);color:var(--orange-600);font-size:12.5px;font-weight:700}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.35}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip-amber{background:var(--amber-50);color:var(--amber-700)}
.chip-blue{background:var(--blue-50);color:var(--blue-700)}
.chip-green{background:var(--green-50);color:var(--green-700)}
.chip-red{background:var(--red-50);color:var(--red-700)}
.chip-violet{background:var(--violet-50);color:var(--violet-700)}
.chip-slate{background:var(--slate-50);color:var(--slate-700)}
.chip-orange{background:var(--orange-50);color:var(--orange-600)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--slate-50);color:var(--slate-700);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.tag-orange{background:var(--orange-50);color:var(--orange-600)}

/* filter chips */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--slate-700);transition:all .15s}
.fchip:hover{border-color:#cdd3e0}
.fchip .n{background:var(--slate-50);color:var(--slate-700);border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:700}
.fchip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.fchip[aria-pressed=true] .n{background:rgba(255,255,255,.18);color:#fff}
.fchip.attn .n{background:var(--orange);color:#fff}

/* avatar */
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;color:#fff;flex:none;letter-spacing:.02em}
.avatar.sm{width:30px;height:30px;font-size:11.5px}
.avatar.lg{width:52px;height:52px;font-size:18px}

/* ---------- KPI ---------- */
.hello{display:flex;align-items:center;gap:20px;padding:24px 28px;border-radius:var(--r);background:linear-gradient(120deg,var(--navy) 0%,var(--navy-3) 70%,#27478a 100%);color:#fff;position:relative;overflow:hidden}
.hello::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(245,130,11,.55),transparent 65%)}
.hello h2{font-size:22px;letter-spacing:-.4px}
.hello p{color:#BFCBE3;margin-top:4px}
.hello .grow{flex:1;position:relative;z-index:1}
.hello .btns{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{display:flex;flex-direction:column;gap:10px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
a.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d6dbe7}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:600;font-size:13px}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.kpi-ic svg{width:20px;height:20px}
.kpi-val{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.kpi-hint{font-size:12.5px;color:var(--muted)}
.ic-orange{background:var(--orange-50);color:var(--orange-600)}.ic-blue{background:var(--blue-50);color:var(--blue-700)}.ic-green{background:var(--green-50);color:var(--green-700)}.ic-violet{background:var(--violet-50);color:var(--violet-700)}
.kpi.hot .kpi-val{color:var(--orange-600)}

/* attention list */
.attn-list{list-style:none}
.attn-item{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line-2);transition:background .12s}
.attn-item:last-child{border-bottom:0}
.attn-item:hover{background:#fafbfd}
.attn-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.attn-ic svg{width:18px;height:18px}
.attn-main{flex:1;min-width:0}
.attn-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attn-main span{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attn-time{color:var(--faint);font-size:12.5px;white-space:nowrap}

/* pipeline */
.pipe{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--slate-50);margin:4px 0 14px}
.pipe i{display:block;height:100%}
.pipe-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:13px}
.pipe-legend a{display:flex;align-items:center;gap:8px;color:var(--slate-700);padding:3px 0}
.pipe-legend a:hover{color:var(--text)}
.pipe-legend b{margin-left:auto;color:var(--text)}
.pipe-legend i{width:10px;height:10px;border-radius:3px;flex:none}
/* chart */
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:#D9E1F0;transition:fill .15s}
.chart .bar.paid{fill:var(--orange)}
.chart g:hover .bar{fill:var(--navy-3)}
.chart g:hover .bar.paid{fill:var(--orange-600)}
.chart text{fill:var(--faint);font-size:11px;font-family:inherit}
.chart line{stroke:var(--line-2)}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- data rows ---------- */
.rows{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.row-head,.row{display:grid;align-items:center;gap:16px;padding:0 22px}
.row-head{height:44px;background:#FAFBFD;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{min-height:68px;padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line-2);transition:background .12s;position:relative}
.row:last-child{border-bottom:0}
a.row:hover,.row.hov:hover{background:#FBFCFE}
.row .c{min-width:0}
.row .c b{display:block;font-weight:700}
.row .c small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-person{display:flex;align-items:center;gap:12px}
.c-person>span:last-child{min-width:0}
.c-chev{color:var(--faint);justify-self:end}
.c-chev svg{width:18px;height:18px}
.cols-orders{grid-template-columns:minmax(150px,1fr) minmax(170px,1.3fr) minmax(0,1.6fr) 100px 150px 24px}
.cols-customers{grid-template-columns:minmax(200px,1.6fr) minmax(0,1.1fr) 120px 150px 110px 200px}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.amount-r{text-align:right}

/* empty / error / skeleton */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:54px 24px;color:var(--muted)}
.empty .ei{width:60px;height:60px;border-radius:18px;background:var(--orange-50);color:var(--orange-600);display:grid;place-items:center;margin-bottom:8px}
.empty .ei svg{width:28px;height:28px}
.empty h3{color:var(--text);font-size:17px}
.empty p{max-width:380px}
.alert{display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:12px;font-size:14px}
.alert-error{background:var(--red-50);color:var(--red-700)}
.alert-info{background:var(--blue-50);color:var(--blue-700)}
.alert-warn{background:var(--amber-50);color:var(--amber-700)}
.alert-ok{background:var(--green-50);color:var(--green-700)}
.alert svg{width:20px;height:20px;flex:none}
.alert .grow{flex:1}
.skel{background:linear-gradient(90deg,#eef1f6 25%,#f7f8fb 37%,#eef1f6 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:8px;height:14px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skel-row{display:flex;gap:16px;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line-2)}

/* ---------- quotes grid ---------- */
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.qcard{display:flex;gap:16px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.qcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d6dbe7}
.qthumb{width:92px;height:92px;border-radius:12px;background:var(--slate-50);flex:none;display:grid;place-items:center;color:var(--faint);overflow:hidden;border:1px solid var(--line-2)}
.qthumb img{width:100%;height:100%;object-fit:cover}
.qthumb svg{width:30px;height:30px}
.qbody{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qtop b{font-weight:700}
.qmeta{color:var(--muted);font-size:13px}
.qdesc{color:var(--slate-700);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--muted)}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - var(--topbar) - var(--pad)*2);min-height:520px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}
.conv-pane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.conv-search{padding:14px;border-bottom:1px solid var(--line-2)}
.conv-list{overflow-y:auto;flex:1}
.conv{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);align-items:flex-start;transition:background .12s}
.conv:hover{background:#FBFCFE}
.conv.active{background:var(--orange-50);box-shadow:inset 3px 0 0 var(--orange)}
.conv-main{min-width:0;flex:1}
.conv-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.conv-top b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-top span{color:var(--faint);font-size:12px;white-space:nowrap}
.conv-prev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .conv-prev{color:var(--text);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none;margin-top:6px}
.thread-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.thread-head{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)}
.thread-head .grow{flex:1;min-width:0}
.thread-head b{display:block;font-size:15px}
.thread-head small{color:var(--muted)}
.back-btn{display:none}
.thread{flex:1;overflow-y:auto;padding:22px 20px;background:#F7F8FB;display:flex;flex-direction:column;gap:14px}
.daysep{align-self:center;font-size:12px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);padding:3px 12px;border-radius:999px}
.bub-row{display:flex;gap:10px;align-items:flex-end;max-width:78%}
.bub-row.them{align-self:flex-start}
.bub-row.us{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:11px 15px;border-radius:16px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.them .bub{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.us .bub{background:var(--navy);color:#fff;border-bottom-right-radius:5px}
.bub-meta{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:12px;color:var(--faint)}
.us .bub-meta{justify-content:flex-end}
.bub-meta button{color:var(--muted);font-weight:600;font-size:12px}
.bub-meta button:hover{color:var(--orange-600)}
.bub-meta .del:hover{color:var(--red-700)}
.reply-box{align-self:flex-end;width:min(560px,92%);background:#fff;border:1.5px solid var(--orange-100);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm)}
.reply-box textarea{min-height:84px;border-color:var(--line)}
.reply-box .reply-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.composer{border-top:1px solid var(--line);padding:14px 20px;background:#fff}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:140px;resize:none;flex:1}
.thread-empty{margin:auto;text-align:center;color:var(--muted)}
.thread-empty .ei{width:64px;height:64px;border-radius:20px;background:var(--orange-50);color:var(--orange-600);display:grid;place-items:center;margin:0 auto 12px}
.thread-empty .ei svg{width:30px;height:30px}

/* ---------- products / projects ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pimg{aspect-ratio:4/3;background:var(--slate-50);display:grid;place-items:center;color:var(--faint);overflow:hidden;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg svg{width:34px;height:34px}
.pimg .tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px)}
.pinfo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.pinfo b{font-size:15px}
.pinfo .price{color:var(--orange-600);font-weight:800;font-size:16px}
.pinfo p{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pact{display:flex;gap:8px;margin-top:auto;padding-top:12px}
.pact .btn{flex:1}
.ad-item{display:flex;gap:16px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line-2)}
.ad-item:last-child{border-bottom:0}
.ad-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.ad-ic svg{width:22px;height:22px}
.ad-main{flex:1;min-width:0}
.ad-main b{display:block}
.ad-main p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-main a{color:var(--blue-700);font-size:12.5px;font-weight:600}

/* stats editor */
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat-card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#FBFCFE}
.stat-card .n{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.stat-card input+input{margin-top:8px}
.stat-card input:first-of-type{font-weight:800;font-size:18px}
.stat-preview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--navy);border-radius:12px;padding:18px;margin-bottom:18px}
.stat-preview div{text-align:center;color:#fff}
.stat-preview b{display:block;font-size:22px;color:var(--orange);letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-preview span{font-size:12px;color:#B5C2DA}

/* settings */
.settings{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:22px;align-items:start}
.stack>*+*{margin-top:22px}
.switch{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.switch:last-of-type{border-bottom:0}
.switch .grow{flex:1}
.switch b{display:block}
.switch small{color:var(--muted);font-size:13px}
.toggle{position:relative;width:44px;height:26px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;z-index:2}
.toggle i{position:absolute;inset:0;border-radius:999px;background:#CDD3E0;transition:background .2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked+i{background:var(--orange)}
.toggle input:checked+i::after{transform:translateX(18px)}
.toggle input:focus-visible+i{outline:3px solid rgba(245,130,11,.45);outline-offset:2px}
.check-list{list-style:none;margin-top:12px}
.check-list li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:13.5px}
.check-list svg{width:18px;height:18px;flex:none;margin-top:2px}
.ok{color:var(--green-700)}.bad{color:var(--red-700)}

/* ---------- dialogs ---------- */
.backdrop{position:fixed;inset:0;z-index:120;background:rgba(9,17,33,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}
.backdrop.drawer-wrap{justify-content:flex-end;padding:0;align-items:stretch}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dialog:focus,.dialog:focus-visible,.view:focus-visible{outline:none}
.dialog{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:calc(100vh - 48px);display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.8,.2,1)}
.dialog.sm{max-width:440px}
.dialog.lg{max-width:1000px}
.dialog.drawer{max-width:560px;height:100%;max-height:none;border-radius:0;animation:slide .26s cubic-bezier(.2,.8,.2,1)}
.dlg-head{display:flex;align-items:flex-start;gap:14px;padding:20px 24px 16px;border-bottom:1px solid var(--line-2)}
.dlg-head h2{font-size:18px;letter-spacing:-.3px;line-height:1.3}
.dlg-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.dlg-head .grow{flex:1;min-width:0}
.dlg-x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.dlg-x:hover{background:var(--slate-50);color:var(--text)}
.dlg-x svg{width:20px;height:20px}
.dlg-body{padding:22px 24px;overflow-y:auto;flex:1}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line-2);background:#FBFCFE;border-radius:0 0 18px 18px;flex-wrap:wrap}
.dialog.drawer .dlg-foot{border-radius:0}
.dlg-foot .left{margin-right:auto}
.dlg-text{color:var(--slate-700);line-height:1.6}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.sect-title{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{min-width:0;word-break:break-word}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#FBFCFE}
.box+.box{margin-top:12px}
.thumb-btn{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--slate-50);position:relative;width:100%}
.thumb-btn img{width:100%;max-height:220px;object-fit:contain;background:var(--slate-50)}
.thumb-btn::after{content:"Click to enlarge";position:absolute;right:8px;bottom:8px;background:rgba(11,27,51,.8);color:#fff;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;opacity:0;transition:opacity .15s}
.thumb-btn:hover::after{opacity:1}
.lightbox{background:rgba(5,10,20,.9);z-index:200;cursor:zoom-out}
.lightbox img{max-width:min(96vw,1200px);max-height:92vh;border-radius:10px;box-shadow:var(--shadow-lg);background:#fff}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px 16px;border:2px dashed #CBD2E0;border-radius:12px;background:#FBFCFE;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s;position:relative}
.dropzone:hover,.dropzone.over{border-color:var(--orange);background:var(--orange-50)}
.dropzone svg{width:30px;height:30px;color:var(--orange-600)}
.dropzone b{color:var(--text)}
.dropzone small{font-size:12.5px}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dropzone.has{padding:10px}
.dropzone.has img{max-height:190px;border-radius:8px;object-fit:contain}
.dropzone.has .dz-hint{font-size:12.5px;margin-top:6px}
.calc{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--slate-50);font-size:13px;color:var(--slate-700)}
.calc b{color:var(--text)}
.seg{display:inline-flex;background:var(--slate-50);border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--text);box-shadow:var(--shadow-sm)}

/* order drawer */
.steps{display:flex;gap:0;margin:2px 0 4px}
.step{flex:1;text-align:center;position:relative;font-size:11.5px;font-weight:600;color:var(--faint);padding-top:26px}
.step::before{content:"";position:absolute;left:50%;top:8px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #D5DAE6;transform:translateX(-50%);z-index:1}
.step::after{content:"";position:absolute;left:-50%;top:13px;width:100%;height:2.5px;background:#E3E7F0}
.step:first-child::after{display:none}
.step.done{color:var(--slate-700)}.step.done::before{background:var(--green);border-color:var(--green)}.step.done::after{background:var(--green)}
.step.now{color:var(--orange-600)}.step.now::before{border-color:var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(245,130,11,.18)}.step.now::after{background:var(--green)}
.items-t{width:100%;border-collapse:collapse;font-size:14px}
.items-t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:left;padding:0 0 8px;font-weight:700}
.items-t td{padding:10px 0;border-top:1px solid var(--line-2);vertical-align:top}
.items-t th:last-child,.items-t td:last-child{text-align:right}
.items-t td.q{white-space:nowrap;color:var(--muted);padding-right:12px}
.totals{margin-top:6px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:3px 0;color:var(--slate-700)}
.totals .grand{font-size:17px;font-weight:800;color:var(--text);padding-top:8px}
.copy-line{display:flex;gap:8px;align-items:flex-start}
.copy-line span{flex:1;min-width:0}
.next-actions{display:flex;gap:10px;flex-wrap:wrap}
.status-set{display:flex;gap:8px}
.status-set select{flex:1}

/* toasts */
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{pointer-events:none;display:flex;align-items:flex-start;gap:12px;background:var(--navy);color:#fff;padding:13px 16px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:600;font-size:14px;max-width:400px;animation:pop .25s ease}
.toast svg{width:20px;height:20px;flex:none;margin-top:1px}
.toast.ok svg{color:#4ADE80}.toast.err{background:#7A1912}.toast.err svg{color:#FFB4AE}.toast.info svg{color:var(--orange)}
.toast a{color:var(--orange-100);text-decoration:underline;font-weight:700;pointer-events:auto}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .25s}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2,.settings{grid-template-columns:minmax(0,1fr)}
  .cols-orders{grid-template-columns:minmax(130px,1fr) minmax(150px,1.2fr) minmax(0,1.3fr) 100px 150px 24px}
}
@media (max-width:980px){
  .app{display:block}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(86vw,300px);transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .icon-btn.menu-btn{display:grid}
  :root{--pad:18px;--topbar:64px}
  .qgrid{grid-template-columns:minmax(0,1fr)}
  .two-col{grid-template-columns:minmax(0,1fr);gap:22px}
  .inbox{grid-template-columns:minmax(0,1fr);height:calc(100vh - var(--topbar) - var(--pad)*2)}
  .inbox .thread-pane{display:none}
  .inbox.show-thread .conv-pane{display:none}
  .inbox.show-thread .thread-pane{display:flex}
  .back-btn{display:grid}
  .bub-row{max-width:90%}
  .hello{flex-direction:column;align-items:flex-start;padding:20px}
}
@media (max-width:820px){
  .row-head{display:none}
  .row{grid-template-columns:1fr auto!important;grid-template-areas:"a b" "c c" "d e";gap:6px 12px;padding:14px 16px}
  .cols-orders .c-ref{grid-area:a}.cols-orders .c-status{grid-area:b;justify-self:end}.cols-orders .c-cust{grid-area:c}.cols-orders .c-items{grid-area:d;color:var(--muted)}.cols-orders .c-total{grid-area:e;justify-self:end}.cols-orders .c-chev{display:none}
  .cols-customers .c-cust{grid-area:a}.cols-customers .c-co{grid-area:c;color:var(--muted)}.cols-customers .c-spend{grid-area:b;justify-self:end}.cols-customers .c-join{grid-area:d;color:var(--muted)}.cols-customers .c-orders{display:none}.cols-customers .c-act{grid-area:e;justify-self:end}
  .row .c-items small{display:none}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr 1fr;gap:12px}
  .kpi{padding:14px}.kpi-val{font-size:25px}
  .field-row,.stats-grid{grid-template-columns:1fr}
  .stat-preview{grid-template-columns:1fr 1fr}
  .tb-actions .txt{display:none}
  .btn-ghost.tb-btn{padding:10px}
  .backdrop{padding:0;align-items:flex-end}
  .dialog{max-width:none;border-radius:18px 18px 0 0;max-height:94vh}
  .dialog.drawer{border-radius:0;max-height:none}
  .dlg-foot{border-radius:0}
  .toasts{left:12px;right:12px;top:10px;transform:none;width:auto;align-items:stretch}.toast{max-width:none}
  .steps .step{font-size:10.5px}
  .kv{grid-template-columns:90px minmax(0,1fr)}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .qcard{flex-direction:column}.qthumb{width:100%;height:150px}
}
@media (max-width:420px){
  .attn-item{padding:12px 16px;gap:10px}
  .attn-item.recent .chip{font-size:0;gap:0;padding:5px}   /* very small phones: status shown as its coloured dot (text still read by screen readers) */
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>

/* ================= messages (inbox) ================= */
const isMobile = () => window.matchMedia('(max-width:980px)').matches;
function buildConvs() {
  const map = {};
  S.messages.forEach(m => { const k = convKey(m); (map[k] = map[k] || { key: k, msgs: [], guest: !m.userId }).msgs.push(m); });
  return Object.values(map).map(c => {
    c.msgs.sort((a, b) => (parseDate(a.createdAt) || 0) - (parseDate(b.createdAt) || 0));
    const cust = c.msgs.find(m => m.senderRole !== 'admin'); const first = c.msgs[0];
    c.userId = c.guest ? null : first.userId; c.email = (cust || first).email;
    c.name = c.guest ? ((cust && cust.name) || c.email) : ((customerById(c.userId) || {}).name || (cust && cust.name) || c.email);
    c.pending = c.msgs.filter(m => m.senderRole !== 'admin' && !m.reply).length;
    let last = 0, prev = '';
    c.msgs.forEach(m => {
      const t1 = parseDate(m.createdAt) || 0; if (t1 >= last) { last = t1; prev = (m.senderRole === 'admin' ? 'You: ' : '') + m.text; }
      if (m.reply) { const t2 = parseDate(m.repliedAt || m.createdAt) || 0; if (t2 >= last) { last = t2; prev = 'You: ' + m.reply; } }
    });
    c.last = last; c.preview = prev; return c;
  }).sort((a, b) => b.last - a.last);
}
function selectedConv(convs) { const id = S.route.id; if (id) return convs.find(c => c.key === id) || null; return isMobile() ? null : (convs[0] || null); }
function convListHtml(list, sel) {

  return list.map(c => '<a class="conv ' + (sel && sel.key === c.key ? 'active' : '') + (c.pending ? ' unread' : '') + '" href="#messages/' + enc(c.key) + '">' + avatar(c.name) + '<span class="conv-main"><span class="conv-top"><b>' + esc(c.name) + '</b><span>' + esc(ago(new Date(c.last))) + '</span></span><span class="conv-prev" style="display:block">' + esc(c.preview) + '</span></span>' + (c.pending ? '<span class="dot" title="Needs a reply"></span>' : '') + '</a>').join('');
}
function dayLabel(d) {
  if (!d) return ''; const sod = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); const diff = Math.round((sod(new Date()) - sod(d)) / 86400000);
  return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : d.toLocaleDateString('en-ZA', { day: 'numeric', month: 'long', year: 'numeric' });
}
function threadEntries(c) {

    else { e.push({ side: 'them', text: m.text, date: parseDate(m.createdAt), id: m.id, msg: m }); if (m.reply) e.push({ side: 'us', text: m.reply, date: parseDate(m.repliedAt || m.createdAt), id: m.id, reply: true }); }

function replyBoxHtml(m, c) {

function threadHtml(c) {

function renderInbox(keepScroll) {

  if (p.quoteNotifications) S.quotes.filter(q => !before.q.has(q.id)).forEach(q => out.push(['New quote request ' + q.id + ' from ' + (q.customer || 'a customer'), '#quotes/' + enc(q.id)]));
  if (p.messageNotifications) S.messages.filter(m => !before.m.has(m.id) && m.senderRole !== 'admin').forEach(m => out.push(['New message from ' + (m.name || 'a customer'), '#messages/' + enc(convKey(m))]));
  out.slice(0, 3).forEach(o => toast(esc(o[0]) + ' · <a href="' + o[1] + '">Open</a>', 'info', { html: true, ttl: 9000 }));

async function refresh(silent) {
  if (S.refreshing) return; S.refreshing = true; const btn = $('#refreshBtn'); if (btn) btn.classList.add('busy');
  const before = { o: new Set(S.orders.map(o => o.id)), q: new Set(S.quotes.map(q => q.id)), m: new Set(S.messages.map(m => m.id)) }; const old = sigOf();
  try {
    await load(['orders', 'quotes', 'messages']); S.lastUpdated = Date.now();
    if (silent) notifyNew(before); else toast('Everything is up to date.', 'info');
    updateBadges(); if (sigOf() !== old || !silent) softRender();

  if (e.target.id === 'replyText' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const b = $('[data-reply-send]'); if (b) sendReply(b); }
  else if (e.target.id === 'composeText' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); const f = $('#composeForm'); if (f) f.requestSubmit(); }
  else if (e.key === '/' && !overlays.length && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ''))) { const s = $('#view input[type=search]'); if (s) { e.preventDefault(); s.focus(); } }
});
document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.id === 'composeForm') {
    e.preventDefault(); const ta = $('#composeText'); const text = ta.value.trim(); if (!text) return;
    await busy($('[type=submit]', f), async () => { try { await A.api('admin-message', { method: 'POST', body: JSON.stringify({ userId: f.dataset.user, text }) }); ta.value = ''; await reloadMessages(); toast('Message sent.'); } catch (err) { toast(err.message, 'err'); } });
  } else if (f.id === 'siteForm') {
    e.preventDefault();
    const content = { tradingName: $('#sTrading').value.trim(), legalName: $('#sLegal').value.trim(), email: $('#sEmail').value.trim(), phone: $('#sPhone').value.trim(), address: $('#sAddress').value.trim(), registrationNumber: $('#sReg').value.trim(), vatNumber: $('#sVat').value.trim() };
    await busy($('[type=submit]', f), async () => { try { const r = await A.api('site-content', { method: 'PUT', body: JSON.stringify({ content }) }); S.content = r.content; toast('Business details saved. They are now live on your site.'); } catch (err) { toast(err.message, 'err'); } });
  } else if (f.id === 'statsForm') {
    e.preventDefault();
    const stats = $$('#statsForm .stat-card').map(c => ({ value: $('[data-stat=value]', c).value.trim(), label: $('[data-stat=label]', c).value.trim() }));
    await busy($('[type=submit]', f), async () => { try { const r = await A.api('stats', { method: 'PUT', body: JSON.stringify({ stats }) }); S.stats = r.stats; toast('Homepage statistics saved.'); renderPage(); } catch (err) { toast(err.message, 'err'); } });
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-pref]')) { const p = prefs(); p[t.dataset.pref] = t.checked; A.write(PREF_KEY, p); toast(t.checked ? 'Alert turned on.' : 'Alert turned off.', 'info'); }
  else if (t.id === 'prefDensity') { const p = prefs(); p.appearance = t.value; A.write(PREF_KEY, p); document.body.classList.toggle('compact', t.value === 'compact'); toast('Display density updated.', 'info'); }
});
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.lastUpdated && Date.now() - S.lastUpdated > 30000) refresh(true); });

/* ================= start ================= */
async function boot() {
  const bootEl = $('#boot');
  try {
    const sess = await A.api('session');
    if (!sess.user || !sess.isAdmin) return;           // app.js sends visitors who are not admins to the sign-in page
    S.me = sess.user; buildShell();
    await load(['orders', 'quotes', 'messages', 'products', 'adverts', 'projects', 'customers', 'stats', 'content']);
    S.lastUpdated = Date.now(); route(); bootEl.remove();
    setInterval(() => { if (!document.hidden) refresh(true); }, 60000);
  } catch (err) {
    bootEl.innerHTML = '<div class="alert alert-error" style="max-width:420px">' + icon('alert') + '<span class="grow">' + esc(err.message || 'The admin page could not start.') + '</span></div><button type="button" class="btn btn-primary" onclick="location.reload()">Try again</button>';
  }
}
document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
